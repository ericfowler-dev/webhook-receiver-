# Render Blueprint — College Fit Dashboard (static site)
#
# This declares ONLY the static site. The existing webhook receiver
# (server.js) is intentionally left out: it was created directly in the
# Render dashboard, and declaring it here would create a second, duplicate
# service rather than adopting the one already running.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# Render's Blueprint flow reads this file from the repository's DEFAULT
# branch (master). It must be present on master or Render reports it as
# missing -- having it only on a feature branch is not enough.

services:
  - type: web
    name: college-fit-dashboard
    runtime: static
    branch: master
    staticPublishPath: ./college-fit-dashboard
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: no-referrer
